# 打开游戏工作流（三段链式）
# 实测登录链路为：
#   标题界面「进入世界」→ 主界面「启动」→ 标题界面「进入世界」→ 游戏世界
# 每段"出现才点、不出现则跳过"，兼容从任意阶段切入。

name: "进入游戏"
version: "1.3"
description: "链式点击「进入世界」「启动」「进入世界」，打开游戏进入世界"

# ─── 全局变量 ───────────────────────────────────────────────
variables:
  enter_label: "enter_world"     # 标题界面「进入世界」按钮模板
  start_label: "start_game"      # 主界面「启动」按钮模板
  enter_min_score: 0.9
  start_min_score: 0.9

# 全局超时兜底（秒）
global_timeout_sec: 120

start: "step_enter_1"

# ─── 工作流步骤 ─────────────────────────────────────────────
steps:

  # 第 1 段：标题界面「进入世界」（短超时，没有则说明在主界面或更后面）
  step_enter_1:
    type: perceive
    target: "${enter_label}"
    min_score: "${enter_min_score}"
    timeout_ms: 5000
    on_found: "step_click_enter_1"
    on_timeout: "step_wait_start"

  step_click_enter_1:
    type: action
    actions:
      - move_to_target: "${enter_label}"
        min_score: "${enter_min_score}"
        duration_ms: 300
        strategy: "fitts"        # 拟人化路径
      - wait: 150
      - click_target: "${enter_label}"
        min_score: "${enter_min_score}"
        hold_ms: 100
    next: "step_wait_start"

  # 第 2 段：主界面「启动」
  step_wait_start:
    type: perceive
    target: "${start_label}"
    min_score: "${start_min_score}"
    timeout_ms: 20000
    on_found: "step_click_start"
    on_timeout: "step_enter_2"

  step_click_start:
    type: action
    actions:
      - move_to_target: "${start_label}"
        min_score: "${start_min_score}"
        duration_ms: 300
        strategy: "fitts"
      - wait: 150
      - click_target: "${start_label}"
        min_score: "${start_min_score}"
        hold_ms: 100
    next: "step_enter_2"

  # 第 3 段：回到标题界面，再点「进入世界」进入世界
  step_enter_2:
    type: perceive
    target: "${enter_label}"
    min_score: "${enter_min_score}"
    timeout_ms: 20000
    on_found: "step_click_enter_2"
    on_timeout: "step_done"      # 两个按钮都不在，视为已在游戏内

  step_click_enter_2:
    type: action
    actions:
      - move_to_target: "${enter_label}"
        min_score: "${enter_min_score}"
        duration_ms: 300
        strategy: "fitts"
      - wait: 150
      - click_target: "${enter_label}"
        min_score: "${enter_min_score}"
        hold_ms: 100
    next: "step_done"

  step_done:
    type: terminate
    message: "打开游戏流程完成，已进入世界"
